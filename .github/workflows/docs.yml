name: Build and publish AMWA documentation

on:
  workflow_call:
    inputs:
      site-name:
        description: Directory name under /new/ on the AMWA server
        required: false
        type: string
        default: ''
      public-docs-root:
        description: Public unversioned documentation root, without a trailing slash
        required: true
        type: string
      versioned:
        description: Publish branch/tag versions as well as the latest alias
        required: false
        type: boolean
        default: true
      source-ref:
        description: Optional branch or tag to build instead of the triggering ref
        required: false
        type: string
        default: ''
      toolkit-ref:
        description: Ref of amwa-spec-docs containing the shared build scripts
        required: false
        type: string
        default: main
    secrets:
      SSH_USER:
        required: true
      SSH_HOST:
        required: true
      SSH_PRIVATE_KEY:
        required: true
      SSH_KNOWN_HOSTS:
        required: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SPEC_SERVER: specs.amwa.tv
      SITE_NAME: ${{ inputs['site-name'] || github.event.repository.name }}
      PUBLIC_DOCS_ROOT: ${{ inputs['public-docs-root'] }}
      VERSIONED: ${{ inputs.versioned }}
      TOOLKIT_DIR: .amwa-spec-docs

    steps:
      - name: Check out documentation repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs['source-ref'] }}

      - name: Check out shared AMWA documentation toolkit
        uses: actions/checkout@v5
        with:
          repository: AMWA-TV/amwa-spec-docs
          ref: ${{ inputs['toolkit-ref'] }}
          path: .amwa-spec-docs
          fetch-depth: 1

      - name: Determine build ref
        env:
          INPUT_SOURCE_REF: ${{ inputs['source-ref'] }}
        run: |
          if [[ -n "${INPUT_SOURCE_REF}" ]]; then
            BUILD_REF="${INPUT_SOURCE_REF}"
          else
            BUILD_REF="${GITHUB_REF_NAME}"
          fi
          echo "BUILD_REF=${BUILD_REF}" >> "$GITHUB_ENV"
          echo "Building docs from ref: ${BUILD_REF}"

      - name: Fetch gh-pages branch
        run: git fetch origin gh-pages --depth=1 || true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Zensical and Mike
        run: |
          python -m pip install --upgrade pip
          python -m pip install zensical
          python -m pip install git+https://github.com/squidfunk/mike.git

      - name: Set up Node.js for RAML rendering
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install RAML renderer
        run: |
          npm install --prefix "${RUNNER_TEMP}/raml2html" raml2html
          echo "RAML2HTML_BIN=${RUNNER_TEMP}/raml2html/node_modules/.bin/raml2html" >> "$GITHUB_ENV"

      - name: Prepare docs tree for site build
        run: bash "${TOOLKIT_DIR}/scripts/prepare-docs.sh"

      - name: Build documentation
        run: zensical build --clean

      - name: Install lychee
        run: sudo snap install lychee

      # The site is checked before Mike places it below this staging prefix, so
      # root-relative canonical/assets links are not local files yet.
      - name: Check for broken links
        continue-on-error: true
        run: >-
          lychee --root-dir ./site --verbose --no-progress
          --accept '100..=103,200..=299,403'
          --accept-timeouts './site/**/*.html'
          --exclude "new/${SITE_NAME}"
          --exclude 'httpstatus\.es'

      - name: Configure git for Mike
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Deploy documentation with Mike
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${VERSIONED}" != "true" ]]; then
            mike deploy --push latest
            exit 0
          fi

          # Every versioned build is stored first. This also makes a release
          # event available for the latest-alias calculation below.
          mike deploy --push "${BUILD_REF}"

          latest_version="$(
            gh release list \
              --repo "${GITHUB_REPOSITORY}" \
              --limit 1000 \
              --json tagName,isDraft,isPrerelease |
            jq -r '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' |
            awk '$0 ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ { print }' |
            sort -V |
            tail -n 1
          )"

          if [[ -z "${latest_version}" ]]; then
            latest_version="$(
              git ls-remote --heads origin |
              awk '{ sub("^refs/heads/", "", $2); print $2 }' |
              awk '$0 ~ /^v[0-9]+\.[0-9]+(-dev|\.x)$/ { print }' |
              sort -V |
              tail -n 1
            )"
          fi

          if [[ -z "${latest_version}" ]]; then
            echo "error: no stable release or version branch found for latest" >&2
            exit 1
          fi

          # During migration, a release may exist in GitHub before its docs
          # have been published with Mike. Build that selected ref now so the
          # latest alias always points to a real published version.
          git fetch origin gh-pages --depth=1
          if ! git ls-tree -d --name-only origin/gh-pages -- "${latest_version}" | grep -Fxq "${latest_version}"; then
            latest_source_ref="refs/tags/${latest_version}"
            if ! git rev-parse --verify --quiet "${latest_source_ref}" >/dev/null; then
              if git ls-remote --exit-code origin "refs/tags/${latest_version}" >/dev/null 2>&1; then
                git fetch origin "refs/tags/${latest_version}:${latest_source_ref}"
              else
                latest_source_ref="refs/remotes/origin/${latest_version}"
                if ! git rev-parse --verify --quiet "${latest_source_ref}" >/dev/null; then
                  git fetch origin "refs/heads/${latest_version}:${latest_source_ref}"
                fi
              fi
            fi

            latest_workspace="${RUNNER_TEMP}/amwa-latest-docs"
            rm -rf "${latest_workspace}"
            git worktree add --detach "${latest_workspace}" "${latest_source_ref}"
            (
              cd "${latest_workspace}"
              export BUILD_REF="${latest_version}"
              export TOOLKIT_DIR="${GITHUB_WORKSPACE}/${TOOLKIT_DIR}"
              bash "${TOOLKIT_DIR}/scripts/prepare-docs.sh"
              zensical build --clean
              mike deploy --push "${latest_version}"
            )
            git worktree remove --force "${latest_workspace}"
            git fetch origin gh-pages --depth=1
          fi

          echo "Updating latest alias to ${latest_version}"
          mike alias --push --update-aliases "${latest_version}" latest

      - name: Export the updated Mike site
        run: |
          rm -rf site
          mkdir site
          git fetch origin gh-pages --depth=1
          git archive origin/gh-pages | tar -x -C site
          # Use a static redirect rather than .htaccess; server-level Apache
          # rules already apply to the AMWA documentation tree.
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=latest/">
            <link rel="canonical" href="latest/">
            <title>Redirecting to the latest documentation</title>
          </head>
          <body>
            <p><a href="latest/">Go to the latest documentation</a></p>
          </body>
          </html>
          EOF

      - name: Upload site to AMWA web server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: bash "${TOOLKIT_DIR}/scripts/upload-site.sh"
