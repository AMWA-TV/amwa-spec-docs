name: Build and publish AMWA documentation

on:
  workflow_call:
    inputs:
      site-name:
        description: Directory name under /new/ on the AMWA server
        required: false
        type: string
        default: ''
      public-docs-root:
        description: Public unversioned documentation root, without a trailing slash
        required: false
        type: string
        default: ''
      versioned:
        description: Publish branch/tag versions as well as the latest alias
        required: false
        type: boolean
        default: true
      source-ref:
        description: Optional branch or tag to build instead of the triggering ref
        required: false
        type: string
        default: ''
      toolkit-ref:
        description: Ref of amwa-spec-docs containing the shared build scripts
        required: false
        type: string
        default: main
      rebuild-all:
        description: Rebuild all matching branches and release tags into gh-pages
        required: false
        type: boolean
        default: false
      release-pattern:
        description: Regex for release tags to include when rebuilding all trees
        required: false
        type: string
        default: '^v[0-9]+\.[0-9]+$|^v[0-9]+\.[0-9]+\.[0-9]+$'
      branch-pattern:
        description: Regex for branches to include when rebuilding all trees
        required: false
        type: string
        default: '^v[0-9]+\.[0-9]+-dev$|^v[0-9]+\.[0-9]+\.x$|^publish-'
    secrets:
      SSH_USER:
        required: true
      SSH_HOST:
        required: true
      SSH_PRIVATE_KEY:
        required: true
      SSH_KNOWN_HOSTS:
        required: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SPEC_SERVER: specs.amwa.tv
      SITE_NAME: ${{ inputs['site-name'] || github.event.repository.name }}
      PUBLIC_DOCS_ROOT: ${{ inputs['public-docs-root'] || format('https://specs.amwa.tv/new/{0}', github.event.repository.name) }}
      VERSIONED: ${{ inputs.versioned }}
      RELEASE_PATTERN: ${{ inputs['release-pattern'] }}
      BRANCH_PATTERN: ${{ inputs['branch-pattern'] }}
      TOOLKIT_DIR: .amwa-spec-docs

    steps:
      - name: Check out documentation repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs['source-ref'] }}

      - name: Check out shared AMWA documentation toolkit
        uses: actions/checkout@v5
        with:
          repository: AMWA-TV/amwa-spec-docs
          ref: ${{ inputs['toolkit-ref'] }}
          path: .amwa-spec-docs
          fetch-depth: 1

      - name: Determine build ref
        env:
          INPUT_SOURCE_REF: ${{ inputs['source-ref'] }}
        run: |
          if [[ -n "${INPUT_SOURCE_REF}" ]]; then
            BUILD_REF="${INPUT_SOURCE_REF}"
          else
            BUILD_REF="${GITHUB_REF_NAME}"
          fi
          echo "BUILD_REF=${BUILD_REF}" >> "$GITHUB_ENV"
          echo "Building docs from ref: ${BUILD_REF}"


      - name: Fetch current metadata for historical refs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          default_branch="$(gh repo view "${GITHUB_REPOSITORY}" --json defaultBranchRef --jq '.defaultBranchRef.name')"
          metadata_dir="${RUNNER_TEMP}/amwa-spec-metadata"
          rm -rf "${metadata_dir}"
          mkdir -p "${metadata_dir}"
          git fetch origin "refs/heads/${default_branch}:refs/remotes/origin/${default_branch}"

          if git cat-file -e "refs/remotes/origin/${default_branch}:README.md"; then
            git show "refs/remotes/origin/${default_branch}:README.md" > "${metadata_dir}/README.md"
          fi
          if git cat-file -e "refs/remotes/origin/${default_branch}:zensical.toml"; then
            git show "refs/remotes/origin/${default_branch}:zensical.toml" > "${metadata_dir}/zensical.toml"
          fi
          if git cat-file -e "refs/remotes/origin/${default_branch}:spec.yml"; then
            git show "refs/remotes/origin/${default_branch}:spec.yml" > "${metadata_dir}/spec.yml"
          fi
          echo "METADATA_DIR=${metadata_dir}" >> "$GITHUB_ENV"

      - name: Fetch gh-pages branch
        run: git fetch origin gh-pages --depth=1 || true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Zensical and Mike
        run: |
          python -m pip install --upgrade pip
          python -m pip install zensical pyyaml
          python -m pip install git+https://github.com/squidfunk/mike.git

      - name: Set up Node.js for RAML rendering
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install RAML renderer
        run: |
          npm install --prefix "${RUNNER_TEMP}/raml2html" raml2html
          echo "RAML2HTML_BIN=${RUNNER_TEMP}/raml2html/node_modules/.bin/raml2html" >> "$GITHUB_ENV"

      - name: Prepare docs tree for site build
        run: |
          bash "${TOOLKIT_DIR}/scripts/prepare-docs.sh"
          test -s docs/images/AMWA-logo.png
          grep -Fq "https://www.amwa.tv" docs/javascripts/amwa-branding.js
          case "${GITHUB_REPOSITORY##*/}" in
            in-*)
              grep -Fq "https://static.wixstatic.com/media/219a48_9e03812d08064ed0a8be326563d9cb9c~mv2.png" docs/javascripts/amwa-branding.js
              ;;
            is-*|ms-*|bcp-*|info-*)
              test -s docs/images/NMOS-logo.png
              grep -Fq "https://specs.amwa.tv/new/nmos" docs/javascripts/amwa-branding.js
              ;;
          esac

      - name: Build documentation
        run: zensical build --clean

      - name: Publish spec metadata
        run: |
          if [[ ! -f spec.yml && -n "${METADATA_DIR:-}" && -f "${METADATA_DIR}/spec.yml" ]]; then
            cp "${METADATA_DIR}/spec.yml" spec.yml
          fi
          python "${TOOLKIT_DIR}/scripts/render-spec-json.py"

      - name: Generate global search manifest
        run: python "${TOOLKIT_DIR}/scripts/render-search-index.py"

      - name: Install lychee
        run: sudo snap install lychee

      # The site is checked before Mike places it below this staging prefix, so
      # root-relative canonical/assets links are not local files yet.
      - name: Check for broken links
        continue-on-error: true
        run: >-
          lychee --root-dir ./site --verbose --no-progress
          --accept '100..=103,200..=299,403'
          --accept-timeouts './site/**/*.html'
          --exclude "new/${SITE_NAME}"
          --exclude 'httpstatus\.es'

      - name: Configure git for Mike
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Deploy documentation with Mike
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${VERSIONED}" != "true" ]]; then
            mike deploy --push latest
            exit 0
          fi

          # Every versioned build is stored first. This also makes a release
          # event available for the latest-alias calculation below.
          mike deploy --push "${BUILD_REF}"

          latest_version="$(
            gh release list \
              --repo "${GITHUB_REPOSITORY}" \
              --limit 1000 \
              --json tagName,isDraft,isPrerelease |
            jq -r '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' |
            awk '$0 ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ { print }' |
            sort -V |
            tail -n 1
          )"

          if [[ -z "${latest_version}" ]]; then
            latest_version="$(
              git ls-remote --heads origin |
              awk '{ sub("^refs/heads/", "", $2); print $2 }' |
              awk '$0 ~ /^v[0-9]+\.[0-9]+(-dev|\.x)$/ { print }' |
              sort -V |
              tail -n 1
            )"
          fi

          if [[ -z "${latest_version}" && "${BRANCH_PATTERN}" == *"^main$"* ]]; then
            latest_version="main"
          fi

          if [[ -z "${latest_version}" ]]; then
            echo "error: no stable release or version branch found for latest" >&2
            exit 1
          fi

          # During migration, a release may exist in GitHub before its docs
          # have been published with Mike. Build that selected ref now so the
          # latest alias always points to a real published version.
          git fetch origin gh-pages --depth=1
          latest_source_ref="refs/tags/${latest_version}"
          if ! git rev-parse --verify --quiet "${latest_source_ref}" >/dev/null; then
            if git ls-remote --exit-code origin "refs/tags/${latest_version}" >/dev/null 2>&1; then
              git fetch origin "refs/tags/${latest_version}:${latest_source_ref}"
            else
              latest_source_ref="refs/remotes/origin/${latest_version}"
              if ! git rev-parse --verify --quiet "${latest_source_ref}" >/dev/null; then
                git fetch origin "refs/heads/${latest_version}:${latest_source_ref}"
              fi
            fi
          fi

          latest_needs_build=false
          if ! git ls-tree -d --name-only origin/gh-pages -- "${latest_version}" | grep -Fxq "${latest_version}"; then
            latest_needs_build=true
          elif ! git cat-file -e "${latest_source_ref}:zensical.toml"; then
            # Rebuild versions previously published with the temporary
            # fallback so their title, badges, and repository link are updated.
            latest_needs_build=true
          fi

          if [[ "${latest_needs_build}" == "true" ]]; then
            latest_workspace="${RUNNER_TEMP}/amwa-latest-docs"
            rm -rf "${latest_workspace}"
            git worktree add --detach "${latest_workspace}" "${latest_source_ref}"
            (
              cd "${latest_workspace}"
              export BUILD_REF="${latest_version}"
              export TOOLKIT_DIR="${GITHUB_WORKSPACE}/${TOOLKIT_DIR}"
              bash "${TOOLKIT_DIR}/scripts/prepare-docs.sh"
              zensical build --clean
              if [[ ! -f spec.yml && -n "${METADATA_DIR:-}" && -f "${METADATA_DIR}/spec.yml" ]]; then
                cp "${METADATA_DIR}/spec.yml" spec.yml
              fi
              python "${TOOLKIT_DIR}/scripts/render-spec-json.py"
              python "${TOOLKIT_DIR}/scripts/render-search-index.py"
              mike deploy --push "${latest_version}"
            )
            git worktree remove --force "${latest_workspace}"
            git fetch origin gh-pages --depth=1
          fi

          echo "Updating latest alias to ${latest_version}"
          mike alias --push --update-aliases "${latest_version}" latest

      - name: Rebuild all matching version trees
        if: inputs.versioned && inputs['rebuild-all']
        run: |
          git fetch origin --tags --prune
          git fetch origin gh-pages --depth=1 || true
          git ls-remote --heads --tags origin |
            python "${TOOLKIT_DIR}/scripts/list-version-refs.py" > "${RUNNER_TEMP}/version-refs.tsv"
          echo "Matching refs to rebuild:"
          cat "${RUNNER_TEMP}/version-refs.tsv"
          if [[ ! -s "${RUNNER_TEMP}/version-refs.tsv" ]]; then
            echo "error: no branches or tags matched the configured rebuild patterns" >&2
            exit 1
          fi

          while IFS=$'\t' read -r ref_kind ref_name; do
            [[ -z "${ref_name}" ]] && continue
            if [[ "${ref_name}" == "${BUILD_REF}" ]]; then
              echo "Skipping ${ref_kind} ${ref_name}; it was built above."
              continue
            fi

            if [[ "${ref_kind}" == "tag" ]]; then
              source_ref="refs/tags/${ref_name}"
              git fetch origin "${source_ref}:${source_ref}"
            else
              source_ref="refs/remotes/origin/${ref_name}"
              git fetch origin "refs/heads/${ref_name}:${source_ref}"
            fi

            workspace="$(mktemp -d "${RUNNER_TEMP}/amwa-version.XXXXXX")"
            git worktree add --detach "${workspace}" "${source_ref}"
            (
              cd "${workspace}"
              export BUILD_REF="${ref_name}"
              export TOOLKIT_DIR="${GITHUB_WORKSPACE}/${TOOLKIT_DIR}"
              bash "${TOOLKIT_DIR}/scripts/prepare-docs.sh"
              zensical build --clean
              if [[ ! -f spec.yml && -n "${METADATA_DIR:-}" && -f "${METADATA_DIR}/spec.yml" ]]; then
                cp "${METADATA_DIR}/spec.yml" spec.yml
              fi
              python "${TOOLKIT_DIR}/scripts/render-spec-json.py"
              python "${TOOLKIT_DIR}/scripts/render-search-index.py"
              mike deploy --push "${ref_name}"
            )
            git worktree remove --force "${workspace}"
            git fetch origin gh-pages --depth=1
          done < "${RUNNER_TEMP}/version-refs.tsv"

      - name: Export the updated Mike site
        run: |
          rm -rf site
          mkdir site
          git fetch origin gh-pages --depth=1
          git archive origin/gh-pages | tar -x -C site
          # Keep spec.json available at the unversioned site root as it was
          # in the former Jekyll deployment, while documentation uses latest/.
          if [[ -f site/latest/spec.json ]]; then
            cp site/latest/spec.json site/spec.json
          fi
          if [[ -f site/latest/global-search.json ]]; then
            cp site/latest/global-search.json site/global-search.json
          fi
          # Use a static redirect rather than .htaccess; server-level Apache
          # rules already apply to the AMWA documentation tree. Use an
          # absolute path so the redirect also works when the request omits
          # the trailing slash (for example, /new/in-003).
          latest_url="/new/${SITE_NAME}/latest/"
          cat > site/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=${latest_url}">
            <link rel="canonical" href="${latest_url}">
            <title>Redirecting to the latest documentation</title>
          </head>
          <body>
            <p><a href="${latest_url}">Go to the latest documentation</a></p>
          </body>
          </html>
          EOF

      - name: Upload site to AMWA web server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: bash "${TOOLKIT_DIR}/scripts/upload-site.sh"
